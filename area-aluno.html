<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno | Nankim Escola de Arte</title>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Caveat:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS Base e Específicos (ordem idêntica ao cursos.html) -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variaveis.css">
    <link rel="stylesheet" href="./css/menu-aluno.css">
    <link rel="stylesheet" href="./css/rodape.css">
    <link rel="stylesheet" href="./css/modais.css">
    <link rel="stylesheet" href="./css/formularios.css">
    <link rel="stylesheet" href="./css/checkout.css">
    <link rel="stylesheet" href="./css/cookies.css">
    <link rel="stylesheet" href="./css/termos.css">
    <link rel="stylesheet" href="./css/reportar.css">
    <link rel="stylesheet" href="./css/area-aluno.css">
</head>
<body>

    <div id="header-container"></div>

    <!-- ================= PAINEL DO ALUNO ================= -->
    <main class="painel-aluno">
        <div class="painel-conteudo-central">

            <!-- Cabeçalho de Boas-Vindas + Resumo Rápido -->
            <section class="hero-painel-aluno">
                <div class="hero-painel-texto">
                    <h1 id="texto-boas-vindas">Olá!</h1>
                    <p>Acompanhe seu progresso, retome de onde parou e explore as próximas etapas da Nankim.</p>
                </div>

                <div class="resumo-metricas-aluno">
                    <div class="metrica-aluno-box">
                        <strong id="contador-aulas-concluidas">0/12</strong>
                        <span>Aulas concluídas</span>
                    </div>
                    <div class="metrica-aluno-box">
                        <strong id="status-plano-aluno">Módulo I Grátis</strong>
                        <span>Plano ativo</span>
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 1: MEUS CURSOS (EM ANDAMENTO) -->
            <section class="secao-categoria-cursos" aria-labelledby="titulo-meus-cursos">
                <div class="cabecalho-secao-aluno">
                    <h2 id="titulo-meus-cursos" class="titulo-secao-cursos">Meus Cursos</h2>
                    <span class="sub-info-secao">Etapa 1 · Base essencial</span>
                </div>
                <div class="grid-cursos-matriculados" id="container-cursos-matriculados">
                    <!-- Preenchido via area-aluno.js -->
                </div>
            </section>

            <!-- SEÇÃO 2: TRILHA DE FORMAÇÃO (PRÓXIMAS ETAPAS) -->
            <section class="secao-categoria-cursos" aria-labelledby="titulo-catalogo-cursos">
                <div class="cabecalho-secao-aluno">
                    <h2 id="titulo-catalogo-cursos" class="titulo-secao-cursos">Próximas Etapas da Formação</h2>
                </div>
                <div class="grid-cursos-catalogo" id="container-cursos-catalogo">
                    <!-- Preenchido via area-aluno.js -->
                </div>
            </section>

        </div>
    </main>

    <!-- Modal de Checkout Direto (mesma estrutura do cursos.html) -->
    <div id="modal-checkout" class="modal">
        <div class="modal-content modal-checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-titulo">
            <button class="close-btn" type="button" data-close="checkout" aria-label="Fechar checkout">&times;</button>
            <h2 id="checkout-titulo">Assinar Fundamentos do Desenho</h2>
            <p class="subtitulo-modal" id="checkout-subtitulo">Escolha seu plano para liberar os 3 módulos completos.</p>
            <div id="checkout-stage"></div>
        </div>
    </div>

    <!-- Injeção do rodapé global -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="./js/global.js"></script>
    <script src="./js/menu-aluno.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/cookies.js"></script>
    <script src="./js/termos.js"></script>
    <script src="./js/reportar.js"></script>
    <script src="./js/area-aluno.js"></script>
</body>
</html>
