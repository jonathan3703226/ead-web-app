<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno - Nankim</title>
    
    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Caveat:wght@500;600;700&family=Montserrat:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Base e Específicos -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variaveis.css">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/rodape.css"> <!-- Adicione esta linha -->
    <link rel="stylesheet" href="./css/cookies.css">
    <link rel="stylesheet" href="./css/termos.css">
    <link rel="stylesheet" href="./css/area-aluno.css">
</head>
<body>

    <!-- ================= HEADER DO ALUNO LOGADO ================= -->
    <header class="header-aluno">
        <div class="header-aluno-container">
            
            <!-- Logo Nankim Apenas Visual (Div sem link) -->
            <div class="logo-aluno-wrapper">
                <div class="logo-icone-wrapper">
                    <img src="./assets/icons/logo.svg" alt="Nankim" class="logo-img-simbolo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 40 40\'><circle cx=\'20\' cy=\'20\' r=\'18\' fill=\'%23f39c12\'/><text x=\'50%\' y=\'58%\' text-anchor=\'middle\' fill=\'white\' font-size=\'20\' font-family=\'Georgia\'>N</text></svg>'">
                </div>
                <div class="logo-texto-wrapper">
                    <span class="logo-fixo">Nankim</span>
                    <span class="logo-expansivel">Art School</span>
                </div>
            </div>
            
            <!-- Menu Dropdown do Usuário -->
            <div class="perfil-dropdown">
                <button class="btn-perfil" id="btn-menu-perfil" aria-expanded="false">
                    <div class="avatar-aluno" id="avatar-iniciais">AL</div>
                    <span id="nome-aluno-topo">Carregando...</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                
                <div class="dropdown-menu" id="dropdown-perfil">
                    <a href="area-aluno.html">Cursos</a>
                    <a href="meu-perfil.html">Meu Perfil</a>
                    <div class="linha-divisoria"></div>
                    <button type="button" id="btn-sair" class="btn-sair-conta">Sair da conta</button>
                </div>
            </div>
        </div>
    </header>

    <!-- ================= PAINEL DE CURSOS ================= -->
    <main class="painel-aluno">
        <div class="painel-conteudo-central">
            
            <section class="boas-vindas">
                <h1 id="texto-boas-vindas">Olá!</h1>
                <p>Seja bem-vindo(a) à sua central de estudos.</p>
            </section>

            <!-- SEÇÃO 1: CURSOS EM ANDAMENTO / MATRICULADOS -->
            <section class="secao-categoria-cursos">
                <h2 class="titulo-secao-cursos">Cursos em Andamento</h2>
                <div class="grid-cursos-aluno" id="container-cursos-matriculados">
                    <!-- Preenchido dinamicamente via JS -->
                </div>
            </section>

            <!-- SEÇÃO 2: CATÁLOGO DE CURSOS DISPONÍVEIS -->
            <section class="secao-categoria-cursos">
                <h2 class="titulo-secao-cursos">Catálogo de Cursos</h2>
                <div class="grid-cursos-aluno" id="container-cursos-catalogo">
                    <!-- Preenchido dinamicamente via JS -->
                </div>
            </section>

            <section class="secao-progresso-curso" id="secao-progresso-curso" aria-labelledby="titulo-progresso-curso" hidden>
                <h2 id="titulo-progresso-curso">Seu progresso em Fundamentos do Desenho</h2>
                <div class="resumo-progresso-curso">
                    <span>Aulas concluídas</span>
                    <strong id="texto-progresso-curso">0% concluído</strong>
                </div>
                <div class="barra-fundo" role="progressbar" aria-label="Progresso em Fundamentos do Desenho" aria-valuemin="0" aria-valuemax="100">
                    <div class="barra-preenchida" id="barra-progresso-curso" style="width: 0%;"></div>
                </div>
                <ol class="trilha-aulas-progresso" id="lista-aulas-progresso"></ol>
                <button class="btn-acao-custom btn-primario" id="btn-marcar-aula-concluida" type="button">Marcar aula como concluída</button>
                <a class="btn-acao-custom btn-secundario" href="sala-de-aula.html">Abrir sala de aula</a>
            </section>

        </div>
    </main>

    <!-- Modal de Checkout Direto -->
    <div id="modal-checkout" class="modal" style="display:none;">
        <div class="modal-content modal-checkout" role="dialog" aria-modal="true" aria-labelledby="checkout-titulo">
            <button class="close-btn" type="button" data-close="checkout" aria-label="Fechar checkout">&times;</button>
            <h2 id="checkout-titulo">Assinar Fundamentos do Desenho</h2>
            <p class="subtitulo-modal" id="checkout-subtitulo">Preencha os dados abaixo.</p>
            <div id="checkout-stage"></div>
        </div>
    </div>

    <!-- Injeção do rodapé global -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="./js/global.js"></script>
    <script src="./js/checkout.js"></script>
    <script src="./js/cookies.js"></script>

    <!-- Script da Área do Aluno -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 1. CARREGAR DADOS DO USUÁRIO E VERIFICAR LOGIN
            const sessaoData = sessionStorage.getItem('nankim_sessao');
            if (!sessaoData) {
                window.location.href = 'index.html';
                return;
            }

            const usuarioSessao = JSON.parse(sessaoData);
            const emailUsuario = usuarioSessao.email;

            let dbUsuarios = JSON.parse(localStorage.getItem('nankim_db')) || [];
            let usuarioAtual = dbUsuarios.find(u => u.email === emailUsuario);

            if (!usuarioAtual) {
                sessionStorage.removeItem('nankim_sessao');
                window.location.href = 'index.html';
                return;
            }

            // 2. PREENCHER HEADER E BOAS VINDAS
            const primeiroNome = usuarioAtual.nome ? usuarioAtual.nome.split(' ')[0] : 'Aluno';
            const inicial = primeiroNome.charAt(0).toUpperCase();
            
            document.getElementById('nome-aluno-topo').textContent = primeiroNome;
            document.getElementById('avatar-iniciais').textContent = inicial;
            
            const textoBoasVindas = document.getElementById('texto-boas-vindas');
            if (textoBoasVindas) {
                textoBoasVindas.textContent = `Olá, ${primeiroNome}!`;
            }

            // 3. DROPDOWN MENU
            const btnMenu = document.getElementById('btn-menu-perfil');
            const dropdown = document.getElementById('dropdown-perfil');

            if (btnMenu && dropdown) {
                btnMenu.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdown.classList.toggle('show');
                });

                document.addEventListener('click', (e) => {
                    if (!dropdown.contains(e.target) && e.target !== btnMenu) {
                        dropdown.classList.remove('show');
                    }
                });
            }

            // 4. LOGOUT
            const btnSair = document.getElementById('btn-sair');
            if (btnSair) {
                btnSair.addEventListener('click', () => {
                    sessionStorage.removeItem('nankim_sessao');
                    window.location.href = 'index.html';
                });
            }

            // 5. RENDERIZAÇÃO DOS CURSOS
            const containerMatriculados = document.getElementById('container-cursos-matriculados');
            const containerCatalogo = document.getElementById('container-cursos-catalogo');

            const listaCursosPlataforma = [
                {
                    id: 'fundamentos-desenho',
                    titulo: 'Fundamentos do Desenho',
                    descricao: 'O ponto de partida para qualquer artista. Domine formas, perspectiva e luz com uma trilha prática e progressiva.',
                    imagem: './assets/img/fundamentos-desenho.jpg'
                },
                {
                    id: 'anatomia-humana',
                    titulo: 'Anatomia Humana',
                    descricao: 'Estude proporções, musculatura e movimento para desenhar figuras humanas com mais confiança.',
                    imagem: './assets/img/anatomia-humana.jpg',
                    disponivel: false
                },
                {
                    id: 'ilustracao-digital',
                    titulo: 'Ilustração Digital',
                    descricao: 'Desenvolva seu processo digital, da composição e cor até a finalização de uma ilustração autoral.',
                    imagem: './assets/img/ilustracao-digital.jpg',
                    disponivel: false
                }
            ];

            const nomesAulasProgresso = [
                'A base de tudo',
                'Desconstruindo objetos',
                'Perspectiva',
                'Teoria da Luz e Sombra',
                'Renderização e Texturas',
                'Projeto Final'
            ];
            let cursoProgressoAtual = null;
            let aulasConcluidas = new Set();
            let aulaProgressoAtual = 0;

            function obterIndiceAula(valor) {
                if (Number.isInteger(valor) && valor >= 0 && valor < nomesAulasProgresso.length) {
                    return valor;
                }

                if (typeof valor === 'string') {
                    const correspondencia = valor.match(/^aula-(\d+)$/);
                    if (correspondencia) {
                        const indice = Number(correspondencia[1]) - 1;
                        if (indice >= 0 && indice < nomesAulasProgresso.length) return indice;
                    }
                }

                return null;
            }

            function carregarAulasConcluidas(curso) {
                const concluidas = new Set();
                const dadosCurso = Array.isArray(curso.aulasConcluidas) ? curso.aulasConcluidas : [];
                dadosCurso.forEach((aula) => {
                    const indice = obterIndiceAula(aula);
                    if (indice !== null) concluidas.add(indice);
                });

                try {
                    const dadosSala = JSON.parse(localStorage.getItem('nankim_aulas_concluidas') || '[]');
                    if (Array.isArray(dadosSala)) {
                        dadosSala.forEach((aula) => {
                            const indice = obterIndiceAula(aula);
                            if (indice !== null) concluidas.add(indice);
                        });
                    }
                } catch (error) {
                    console.error('Não foi possível carregar o progresso da sala de aula:', error);
                }

                return concluidas;
            }

            function salvarProgressoAulas() {
                const db = JSON.parse(localStorage.getItem('nankim_db')) || [];
                const idxUsuario = db.findIndex((usuario) =>
                    String(usuario.email || '').toLowerCase() === String(usuarioAtual.email || '').toLowerCase()
                );
                if (idxUsuario === -1) {
                    console.error('Não foi possível salvar o progresso: aluno não encontrado.');
                    return false;
                }

                const usuarioSalvo = db[idxUsuario];
                usuarioSalvo.cursos = Array.isArray(usuarioSalvo.cursos) ? usuarioSalvo.cursos : [];
                const cursoSalvo = usuarioSalvo.cursos.find((curso) => curso.id === 'fundamentos-desenho');
                if (!cursoSalvo) {
                    console.error('Não foi possível salvar o progresso: matrícula do curso não encontrada.');
                    return false;
                }

                cursoSalvo.aulasConcluidas = [...aulasConcluidas].sort((a, b) => a - b);
                cursoSalvo.progresso = Math.round((aulasConcluidas.size / nomesAulasProgresso.length) * 100);
                cursoSalvo.ultimaAula = aulaProgressoAtual;
                db[idxUsuario] = usuarioSalvo;
                localStorage.setItem('nankim_db', JSON.stringify(db));
                localStorage.setItem('nankim_aulas_concluidas', JSON.stringify(
                    cursoSalvo.aulasConcluidas.map((indice) => `aula-${indice + 1}`)
                ));
                localStorage.setItem('nankim_ultima_aula', `aula-${aulaProgressoAtual + 1}`);
                usuarioAtual = usuarioSalvo;
                cursoProgressoAtual = cursoSalvo;
                return true;
            }

            function atualizarPainelProgresso() {
                const lista = document.getElementById('lista-aulas-progresso');
                const secao = document.getElementById('secao-progresso-curso');
                const percentual = Math.round((aulasConcluidas.size / nomesAulasProgresso.length) * 100);
                const barra = document.getElementById('barra-progresso-curso');
                const barraFundo = barra.parentElement;

                document.getElementById('texto-progresso-curso').textContent = `${percentual}% concluído`;
                barra.style.width = `${percentual}%`;
                barraFundo.setAttribute('aria-valuenow', String(percentual));
                lista.replaceChildren();

                nomesAulasProgresso.forEach((nome, indice) => {
                    const item = document.createElement('li');
                    const botao = document.createElement('button');
                    botao.type = 'button';
                    botao.textContent = `Módulo ${indice + 1}: ${nome}`;
                    botao.classList.toggle('aula-atual', indice === aulaProgressoAtual);
                    botao.classList.toggle('aula-concluida', aulasConcluidas.has(indice));
                    if (indice === aulaProgressoAtual) botao.setAttribute('aria-current', 'step');
                    botao.addEventListener('click', () => {
                        aulaProgressoAtual = indice;
                        salvarProgressoAulas();
                        atualizarPainelProgresso();
                    });
                    item.append(botao);
                    lista.append(item);
                });

                const botaoConcluir = document.getElementById('btn-marcar-aula-concluida');
                botaoConcluir.disabled = aulasConcluidas.has(aulaProgressoAtual);
                botaoConcluir.textContent = botaoConcluir.disabled
                    ? 'Aula concluída'
                    : 'Marcar aula como concluída';
                secao.hidden = false;
            }

            function renderizarProgressoCurso() {
                cursoProgressoAtual = usuarioAtual.matriculado === true && Array.isArray(usuarioAtual.cursos)
                    ? usuarioAtual.cursos.find((curso) => curso.id === 'fundamentos-desenho')
                    : null;

                const secao = document.getElementById('secao-progresso-curso');
                if (!cursoProgressoAtual) {
                    secao.hidden = true;
                    aulasConcluidas = new Set();
                    return;
                }

                aulasConcluidas = carregarAulasConcluidas(cursoProgressoAtual);
                const indiceSalvo = obterIndiceAula(localStorage.getItem('nankim_ultima_aula'));
                const indiceCurso = Number(cursoProgressoAtual.ultimaAula);
                aulaProgressoAtual = indiceSalvo !== null
                    ? indiceSalvo
                    : Math.min(Math.max(Number.isInteger(indiceCurso) ? indiceCurso : 0, 0), nomesAulasProgresso.length - 1);
                atualizarPainelProgresso();
            }

            document.getElementById('btn-marcar-aula-concluida').addEventListener('click', () => {
                if (!cursoProgressoAtual) return;
                aulasConcluidas.add(aulaProgressoAtual);
                aulaProgressoAtual = Math.min(aulaProgressoAtual + 1, nomesAulasProgresso.length - 1);
                if (salvarProgressoAulas()) atualizarPainelProgresso();
            });

            function renderizarCentralAlunos() {
                containerMatriculados.innerHTML = '';
                containerCatalogo.innerHTML = '';
                renderizarProgressoCurso();

                listaCursosPlataforma.forEach(curso => {
                    if (curso.id === 'fundamentos-desenho') {
                        renderizarCursoFundamentos();
                    } else {
                        renderizarCursoFuturo(curso);
                    }
                });

                document.querySelectorAll('[data-close="checkout"]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const modalCheckout = document.getElementById('modal-checkout');
                        if (modalCheckout) modalCheckout.style.display = 'none';
                    });
                });

                document.querySelectorAll('.btn-abrir-checkout-direto').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        if (typeof iniciarCheckoutLogado === 'function') {
                            iniciarCheckoutLogado();
                        } else {
                            console.error('Função iniciarCheckoutLogado não foi encontrada.');
                        }
                    });
                });

                const btnLiberarMod1 = document.getElementById('btn-liberar-mod1');
                if (btnLiberarMod1) {
                    btnLiberarMod1.addEventListener('click', () => {
                        usuarioAtual.modulo1_liberado = true;
                        const db = JSON.parse(localStorage.getItem('nankim_db')) || [];
                        const idx = db.findIndex(u => u.email === usuarioAtual.email);
                        if (idx !== -1) {
                            db[idx].modulo1_liberado = true;
                            localStorage.setItem('nankim_db', JSON.stringify(db));
                        }
                        renderizarCentralAlunos();
                    });
                }
            }

            function renderizarCursoFuturo(curso) {
                const htmlCard = `
                    <article class="curso-card-aluno card-estatico">
                        <img src="${curso.imagem}" alt="${curso.titulo}" class="curso-card-imagem">
                        <div class="curso-painel">
                            <header class="curso-cabecalho">
                                <span class="tag-status tag-breve">Em breve</span>
                                <h2>${curso.titulo}</h2>
                            </header>
                        </div>
                    </article>
                `;
                containerCatalogo.innerHTML += htmlCard;
            }

            function renderizarCursoFundamentos() {
                const matriculado = usuarioAtual.matriculado === true;
                const degustacao = usuarioAtual.modulo1_liberado === true;

                let tagHTML = '';
                let progressoHTML = '';
                let acoesHTML = '';
                let filtroImg = 'grayscale(0%) opacity(1)';
                const titulo = 'Fundamentos do Desenho';
                const desc = 'O ponto de partida para qualquer artista. Domine formas, perspectiva e luz com uma trilha prática e progressiva.';
                const imagem = './assets/img/fundamentos-desenho.jpg';

                if (matriculado) {
                    tagHTML = `<span class="tag-status tag-completo">Curso Completo</span>`;
                    progressoHTML = `
                        <div class="barra-fundo"><div class="barra-preenchida" style="width: ${Math.round((aulasConcluidas.size / nomesAulasProgresso.length) * 100)}%;"></div></div>
                        <span class="texto-progresso">${Math.round((aulasConcluidas.size / nomesAulasProgresso.length) * 100)}% concluído</span>
                    `;
                    acoesHTML = `<a href="sala-de-aula.html" class="btn-acao-custom btn-primario">Continuar Curso</a>`;
                    containerMatriculados.innerHTML += criarCardExpandivelHTML(titulo, desc, imagem, tagHTML, progressoHTML, acoesHTML, filtroImg, false);
                } else if (degustacao) {
                    tagHTML = `<span class="tag-status tag-degustacao">Módulo 1 Liberado</span>`;
                    progressoHTML = `<span class="texto-aviso-bloqueado">Aproveite sua aula experimental grátis.</span>`;
                    acoesHTML = `
                        <a href="sala-de-aula.html" class="btn-acao-custom btn-primario">Acessar Módulo 1</a>
                        <button type="button" class="btn-acao-custom btn-comprar btn-abrir-checkout-direto">Assinar Curso Completo</button>
                    `;
                    containerMatriculados.innerHTML += criarCardExpandivelHTML(titulo, desc, imagem, tagHTML, progressoHTML, acoesHTML, filtroImg, true);
                } else {
                    tagHTML = `<span class="tag-status tag-bloqueado">🔒 Bloqueado</span>`;
                    filtroImg = 'grayscale(100%) opacity(0.6)';
                    progressoHTML = `
                        <span class="texto-aviso-bloqueado" style="color: #e74c3c;">
                            Você ainda não possui acesso a este curso.
                        </span>
                    `;
                    acoesHTML = `
                        <button type="button" class="btn-acao-custom btn-secundario" id="btn-liberar-mod1">Liberar Módulo 1 Grátis</button>
                        <button type="button" class="btn-acao-custom btn-comprar btn-abrir-checkout-direto">Assinar Curso Completo</button>
                    `;
                    containerCatalogo.innerHTML += criarCardExpandivelHTML(titulo, desc, imagem, tagHTML, progressoHTML, acoesHTML, filtroImg, true);
                }
            }

            function criarCardExpandivelHTML(titulo, descricao, imagem, tagHTML, progressoHTML, acoesHTML, filtroImg, mostrarPreco) {
                const rodapePreco = mostrarPreco ? `
                    <div class="curso-compra">
                        <p><span>Investimento único</span><strong>R$ 49,90</strong></p>
                        ${acoesHTML}
                    </div>
                ` : `
                    <div class="curso-compra" style="justify-content: flex-start;">
                        ${acoesHTML}
                    </div>
                `;

                return `
                    <article class="curso-card-aluno">
                        <img src="${imagem}" alt="${titulo}" class="curso-card-imagem" style="filter: ${filtroImg};">
                        <div class="curso-painel">
                            <header class="curso-cabecalho">
                                ${tagHTML}
                                <h2>${titulo}</h2>
                            </header>
                            <div class="curso-detalhes">
                                <p class="curso-descricao">${descricao}</p>
                                <div class="area-status-curso">${progressoHTML}</div>
                                ${rodapePreco}
                            </div>
                        </div>
                    </article>
                `;
            }

            renderizarCentralAlunos();
        });
    </script>
</body>
</html>
